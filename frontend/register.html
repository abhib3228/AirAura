<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · AirAura</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <form class="glass auth-card" data-mode="register" novalidate>
      <a class="logo" href="index.html">Air<span>Aura</span></a>
      <h1 style="margin-top:18px">Create your account</h1>
      <p class="muted">Free, and takes under a minute.</p>
      <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" /><small class="err" data-for="name"></small></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" /><small class="err" data-for="email"></small></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" /><small class="err" data-for="password"></small></div>
      <div class="form-error" hidden></div>
      <button class="btn" type="submit">Create account</button>
      <p class="auth-alt">Already registered? <a href="login.html">Log in</a></p>
    </form>
  </div>
</body>
</html>
