<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · AirAura</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/scene.js"></script>
  <script defer src="js/fx.js"></script>
  <script defer src="js/dashboard.js"></script>
</head>
<body>
  <canvas id="smog" aria-hidden="true"></canvas>

  <nav class="nav glass">
    <a class="logo" href="index.html">Air<span>Aura</span></a>
    <div class="nav-actions"><span class="muted" id="userName"></span><button class="btn ghost" id="logout">Log out</button></div>
  </nav>

  <main class="container">
    <section class="toolbar glass">
      <div class="search">
        <input id="q" type="search" placeholder="Search a city…" autocomplete="off" aria-label="Search for a city" />
        <ul id="results" class="results" hidden></ul>
      </div>
      <button class="btn ghost" id="locate" type="button">📍 Use my location</button>
      <button class="btn ghost" id="saveFav" type="button">☆ Save city</button>
    </section>
    <div id="favs" class="chips"></div>
    <div id="status" class="notice" hidden></div>

    <div id="dash" class="grid loading">
      <article class="card glass aqi-card">
        <h2 id="cityName" class="city sk">City</h2>
        <div class="gauge">
          <svg viewBox="0 0 200 110" role="img" aria-label="AQI gauge">
            <path class="track" d="M 10 100 A 90 90 0 0 1 190 100" pathLength="100" />
            <path class="arc" id="arc" d="M 10 100 A 90 90 0 0 1 190 100" pathLength="100" />
          </svg>
          <div class="gauge-num"><span id="aqiVal" class="sk">--</span><small>US AQI</small></div>
        </div>
        <span id="aqiCat" class="pill sk">Loading</span>
        <p id="aqiAdvice" class="sk">Loading summary</p>
        <p class="note" id="updated"></p>
      </article>

      <article class="card glass weather-card"><h2>Weather</h2><div class="tiles" id="weather"></div></article>
      <article class="card glass pollutants"><h2>Pollutants (µg/m³)</h2><div class="tiles" id="pollutants"></div></article>

      <article class="card glass health">
        <h2>Health recommendations</h2>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="general">General public</button>
          <button class="tab" data-tab="sensitive">Children &amp; elderly</button>
          <button class="tab" data-tab="patients">Asthma &amp; heart</button>
          <button class="tab" data-tab="exercise">Outdoor exercise</button>
        </div>
        <p class="panel sk" id="panel">Loading advice</p>
        <div class="gear">
          <div><small>😷 Mask</small><span id="mask" class="sk">–</span></div>
          <div><small>🌀 Air purifier</small><span id="purifier" class="sk">–</span></div>
        </div>
      </article>

      <article class="card glass compare">
        <h2>Live API vs ML prediction</h2>
        <div class="compare-nums">
          <div><small>Live API AQI</small><b id="liveAqi" class="sk">--</b></div>
          <div><small>ML predicted AQI</small><b id="mlAqi" class="sk">--</b></div>
        </div>
        <p class="diff sk" id="diff">–</p>
        <div class="chart-box"><canvas id="chart"></canvas></div>
        <p class="note" id="mlNote"></p>
      </article>

      <article class="card glass map-card"><h2>Pollution map</h2><div id="map"></div></article>
    </div>
  </main>
</body>
</html>
