<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · AirAura</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <form class="glass auth-card" data-mode="login" novalidate>
      <a class="logo" href="index.html">Air<span>Aura</span></a>
      <h1 style="margin-top:18px">Welcome back</h1>
      <p class="muted">Log in to see your dashboard.</p>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" /><small class="err" data-for="email"></small></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" /><small class="err" data-for="password"></small></div>
      <div class="form-error" hidden></div>
      <button class="btn" type="submit">Log in</button>
      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
    </form>
  </div>
</body>
</html>
